name: Build ELMA BOT PRO APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev \
            libffi-dev libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            gettext

      - name: Vérifier les fichiers ELMA
        run: |
          test -f main.py
          test -f service.py
          test -f buildozer.spec
          test -f subconscient_elma.json
          test -f vic_config.json
          test -f icone.png
          echo "Tous les fichiers requis sont présents."

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Compiler ELMA BOT PRO
        run: |
          buildozer android debug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ELMA-BOT-PRO-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
